name: Build Android APK

# Builds an installable, fully offline APK on GitHub's runners (they include the Android SDK).
# Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main, master, 'claude/**']
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kpi-consultant-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "kpi-consultant-${GITHUB_REF_NAME}.apk"
          # Release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "KPI Consultant ${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KPI Consultant ${{ github.ref_name }}
          body_path: release-notes.md
          files: kpi-consultant-${{ github.ref_name }}.apk
